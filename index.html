<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة القصبى للمواصفات الهندسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { font-family: 'Cairo', sans-serif; }
        body { background-color: #f3f4f6; }
        .file-card { background: white; border: 1px solid #e5e7eb; border-radius: 1rem; transition: all 0.3s ease; display: flex; flex-direction: column; height: 100%; }
        .file-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); border-color: #1E3A8A; }
        .btn-primary { background: #1E3A8A; color: white; transition: 0.3s; }
        .btn-primary:hover { background: #1e40af; }
        .btn-outline { border: 2px solid #1E3A8A; color: #1E3A8A; background: white; transition: 0.3s; }
        .btn-outline:hover { background: #f0f9ff; }
        .cat-btn { background: white; border: 2px solid #e2e8f0; border-radius: 12px; padding: 1rem; text-align: center; cursor: pointer; transition: all 0.3s; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100px; }
        .cat-btn.active { background: #1E3A8A; color: white; border-color: #1E3A8A; box-shadow: 0 8px 15px -3px rgba(30, 58, 138, 0.3); }
        .cat-btn:hover:not(.active) { border-color: #1E3A8A; transform: translateY(-2px); }
        .stat-card { background: white; padding: 1rem; border-radius: 1rem; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .stat-number { font-size: 1.5rem; font-weight: 800; color: #1E3A8A; }
    </style>
</head>
<body>

    <header class="bg-[#1E3A8A] text-white p-4 shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <span class="text-3xl">🏗️</span>
                <div>
                    <h1 class="text-xl font-bold">منصة القصبى</h1>
                    <p class="text-xs text-blue-200">للمواصفات الهندسية</p>
                </div>
            </div>
            <div class="flex gap-2">
                <a href="https://wa.me/966581295794" target="_blank" class="bg-green-500 px-4 py-2 rounded-lg text-sm font-bold hover:bg-green-600 transition flex items-center gap-2">
                    <i class="fa-brands fa-whatsapp text-lg"></i> واتساب
                </a>
                <a href="mailto:elkasaby1988@gmail.com" class="bg-white/20 px-4 py-2 rounded-lg text-sm font-bold hover:bg-white/30 transition flex items-center gap-2">
                    <i class="fa-regular fa-envelope text-lg"></i> إيميل
                </a>
            </div>
        </div>
    </header>

    <main class="container mx-auto p-4 max-w-7xl">
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8 mt-4">
            <div class="stat-card border-b-4 border-blue-500">
                <div class="text-gray-500 text-xs font-bold mb-1">الزوار</div>
                <div class="stat-number" id="visitorsCount">1,245</div>
            </div>
            <div class="stat-card border-b-4 border-green-500">
                <div class="text-gray-500 text-xs font-bold mb-1">التحميلات</div>
                <div class="stat-number" id="downloadsCount">3,890</div>
            </div>
            <div class="stat-card border-b-4 border-purple-500">
                <div class="text-gray-500 text-xs font-bold mb-1">الملفات</div>
                <div class="stat-number" id="filesCount">18</div>
            </div>
            <div class="stat-card border-b-4 border-orange-500">
                <div class="text-gray-500 text-xs font-bold mb-1">التحديث</div>
                <div class="text-lg font-bold text-gray-700">يومي</div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm mb-8">
            <div class="relative">
                <input type="text" id="searchInput" onkeyup="searchFiles()" 
                    class="w-full p-4 pr-10 border-2 border-gray-100 rounded-xl focus:outline-none focus:border-[#1E3A8A] text-lg" 
                    placeholder="🔍 ابحث برقم الكود أو اسم المواصفة...">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm font-bold">
                    <span id="count">0</span> نتيجة
                </span>
            </div>
        </div>

        <h2 class="text-lg font-bold text-gray-700 mb-4 border-r-4 border-[#1E3A8A] pr-2">تصفح حسب الكود:</h2>
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mb-10">
            <div onclick="filterCategory('all')" class="cat-btn active" data-category="all">
                <span class="icon">📚</span><span class="title">الكل</span>
            </div>
            <div onclick="filterCategory('ASTM')" class="cat-btn" data-category="ASTM">
                <span class="icon">🧪</span><span class="title">ASTM</span>
            </div>
            <div onclick="filterCategory('ACI')" class="cat-btn" data-category="ACI">
                <span class="icon">🏗️</span><span class="title">ACI</span>
            </div>
            <div onclick="filterCategory('BS')" class="cat-btn" data-category="BS">
                <span class="icon">🇬🇧</span><span class="title">BS</span>
            </div>
            <div onclick="filterCategory('AASHTO')" class="cat-btn" data-category="AASHTO">
                <span class="icon">🛣️</span><span class="title">AASHTO</span>
            </div>
            <div onclick="filterCategory('OTHER')" class="cat-btn" data-category="OTHER">
                <span class="icon">🌐</span><span class="title">أخرى</span>
            </div>
        </div>

        <div id="filesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12"></div>

        <div class="bg-white p-6 rounded-2xl shadow-sm border-t-4 border-[#1E3A8A]">
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                <i class="fa-solid fa-comments text-[#1E3A8A]"></i> مجتمع المنصة
            </h2>
            <script src="https://giscus.app/client.js"
                data-repo="Mohamed742406/-elkasaby-standards"
                data-repo-id="R_kgDONOlQMQ"
                data-category="General"
                data-category-id="DIC_kwDONOlQMc4CkOjl"
                data-mapping="pathname"
                data-strict="0"
                data-reactions-enabled="1"
                data-emit-metadata="0"
                data-input-position="top"
                data-theme="light"
                data-lang="ar"
                crossorigin="anonymous"
                async>
            </script>
        </div>

    </main>

    <footer class="bg-gray-800 text-white text-center p-6 mt-8">
        <p>© 2025 منصة القصبى - م. محمد القصبي</p>
    </footer>

    <script>
        // حل مشكلة الروابط: استخدام encodeURIComponent للأسماء المعقدة
        const files = [
                                    {
                code: "ACI 211",
                title: "تصميم خلطات الخرسانة (Mix Design)",
                desc: "شرح مبسط لخطوات تصميم الخلطة الخرسانية مع مثال عددي كامل.",
                group: "ACI",
                fileName: "تصميم خلطة خرسانة ACI211.pdf"
            },
            {
                code: "ASTM D6913",
                title: "تحليل التدرج الحبيبي للتربة",
                desc: "طريقة الاختبار القياسية لتوزيع حجم حبيبات التربة باستخدام المناخل.",
                group: "ASTM",
                fileName: "ASTM D6913-MO.elkasaby.pdf"
            },
            
            { code: "DIN 18134", title: "اختبار التحميل اللوحي", desc: "المواصفة الالمانية للاختبار التحميل.", group: "أخرى", fileName: "DIN-18134-Mo.elkasaby.pdf" },
            { code: "ACI 214R-11", title: "دليل تقييم نتائج الخرسانة", desc: "الطريقة الإحصائية لتقييم نتائج كسر المكعبات.", group: "ACI", fileName: "ACI 214R-11-Mo.elkasaby...pdf" },
            { code: "ASTM C39", title: "مقاومة الضغط (اسطوانات)", desc: "الطريقة القياسية لكسر اسطوانات الخرسانة.", group: "ASTM", fileName: "C39 -23-Mo.elkasaby.pdf" },
            { code: "ASTM C131", title: "مقاومة التآكل (لوس أنجلوس)", desc: "اختبار الركام بجهاز لوس أنجلوس.", group: "ASTM", fileName: "ASTEM C131- Mo.elkasaby.pdf" },
            { code: "ASTM C136", title: "التحليل المنخلي للركام", desc: "تدرج حبيبات الركام الناعم والخشن.", group: "ASTM", fileName: "ASTM C136-Mo.elkasaby.pdf" },
            { code: "ASTM C127", title: "الكثافة والامتصاص (ركام)", desc: "الوزن النوعي والامتصاص للركام الخشن.", group: "ASTM", fileName: "ASTM -C 127-Mo.elkasaby.pdf" },
            { code: "ASTM C702", title: "تقليل عينات الركام", desc: "تقسيم العينات الكبيرة لعينات اختبار.", group: "ASTM", fileName: "C 702 - C 702M - Mo.elkasaby.pdf" },
            { code: "ASTM D75", title: "طرق أخذ عينات الركام", desc: "سحب عينات الركام من الموقع.", group: "ASTM", fileName: "D75_D75M-19 -Mo.elkasaby.pdf" },
            { code: "ASTM C1231", title: "الأغطية اللاصقة (Capping)", desc: "استخدام الـ Rubber Caps لكسر الاسطوانات.", group: "ASTM", fileName: "C1231-Mo.elkasaby -مترجم.pdf" },
            { code: "ASTM D1557", title: "اختبار الدمك (المعدل)", desc: "الكثافة الجافة وعلاقة الرطوبة للتربة.", group: "ASTM", fileName: "ASTM D1557 -12-Mo.elkasaby.pdf" },
            { code: "ASTM D2216", title: "محتوى الرطوبة", desc: "نسبة المياه في التربة والصخور.", group: "ASTM", fileName: "ASTM D2216 -Mo.elkasaby.pdf" },
            { code: "ASTM D2041", title: "الكثافة القصوى (Rice Test)", desc: "الكثافة النظرية للخلطات الأسفلتية.", group: "ASTM", fileName: "D 2041-19-Mo.elkasaby.pdf" },
            { code: "ASTM D6926", title: "تحضير عينات مارشال", desc: "دمك الأسفلت بجهاز مارشال.", group: "ASTM", fileName: "D 6926 - 16-Mo.elkasaby.pdf" },
            { code: "ASTM D2172", title: "استخلاص الأسفلت", desc: "فصل البيتومين عن الخلطة.", group: "ASTM", fileName: "ASTEM D 2172-24-Mo.elkasaby.pdf" },
            { code: "ASTM D2726", title: "الكثافة النسبية للأسفلت", desc: "Bulk Specific Gravity للعينات المدموكة.", group: "ASTM", fileName: "ASTM D2726 - Mo.elkasaby..pdf" },
            { code: "ASTM D5444", title: "تحليل البودرة المستخلصة", desc: "تحليل المواد الناعمة بعد الاستخلاص.", group: "ASTM", fileName: "ASTM D-5444-24-Mo.elkasaby.pdf" },
            { code: "ASTM C76", title: "مواسير الخرسانة المسلحة", desc: "مواصفات أنابيب الصرف.", group: "ASTM", fileName: "C76-Mo.elkasaby.pdf" },
            { code: "ASTM C478", title: "غرف التفتيش (Manholes)", desc: "غرف المنهولات الخرسانية.", group: "ASTM", fileName: "C478M -Mo.elkasaby.pdf" },
            { code: "ASTM C1433", title: "العبارات الصندوقية", desc: "العبارات الخرسانية (Box Culverts).", group: "ASTM", fileName: "C1433M − 16b .Mo.elkasaby.pdf" }
        ];

        let currentCategory = 'all';

        function incrementStats() {
            const v = document.getElementById('visitorsCount');
            const d = document.getElementById('downloadsCount');
            const f = document.getElementById('filesCount');
            
            let vCount = parseInt(localStorage.getItem('vCount') || '1245') + 1;
            localStorage.setItem('vCount', vCount);
            
            v.textContent = vCount.toLocaleString();
            d.textContent = "3,890";
            f.textContent = files.length;
        }

        function displayFiles(list) {
            const container = document.getElementById('filesContainer');
            container.innerHTML = '';

            if (list.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center py-10 text-gray-400 text-xl">لا توجد ملفات</div>';
                return;
            }

            list.forEach(file => {
                // تحويل اسم الملف لرابط صحيح
                const safeLink = encodeURI(file.fileName);
                
                const card = `
                    <div class="file-card p-6">
                        <div class="flex justify-between mb-4">
                            <span class="bg-blue-50 text-[#1E3A8A] px-3 py-1 rounded-lg font-bold font-mono text-sm border border-blue-100">${file.code}</span>
                            <span class="bg-gray-100 text-gray-500 px-2 py-1 rounded-lg text-xs font-medium">${file.group}</span>
                        </div>
                        <h3 class="text-lg font-bold text-gray-800 mb-2">${file.title}</h3>
                        <p class="text-gray-500 text-sm mb-6 flex-grow leading-relaxed">${file.desc}</p>
                        
                        <div class="mt-auto pt-4 border-t border-gray-100 flex gap-2">
                            <a href="${safeLink}" target="_blank" class="btn-outline w-1/2 py-2.5 rounded-xl font-bold flex items-center justify-center gap-2">
                                <i class="fa-regular fa-eye"></i> معاينة
                            </a>
                            <a href="${safeLink}" download class="btn-primary w-1/2 py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 shadow-md">
                                <i class="fa-solid fa-download"></i> تحميل
                            </a>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.classList.remove('active');
                if(b.dataset.category === cat) b.classList.add('active');
            });
            searchFiles();
        }

        function searchFiles() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = files.filter(f => {
                const matchSearch = f.title.toLowerCase().includes(q) || f.code.toLowerCase().includes(q);
                const matchCat = currentCategory === 'all' || f.group === currentCategory;
                return matchSearch && matchCat;
            });
            displayFiles(filtered);
        }

        // تشغيل
        incrementStats();
        displayFiles(files);
    </script>
</body>
</html>
